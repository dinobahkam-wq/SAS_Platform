name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm ci --no-audit --no-fund

      - name: Editorial and security regressions
        run: |
          node --experimental-strip-types --test \
            scripts/check-briefing-scope-package1.mjs \
            scripts/check-briefing-to-studio-package2.mjs \
            scripts/check-briefing-official-card-package3.mjs \
            scripts/check-briefing-overview.mjs \
            scripts/check-briefing-editorial-dimensions.mjs \
            scripts/check-briefing-four-layer-display.mjs \
            scripts/check-briefing-geography-v1.mjs \
            scripts/check-briefing-photo-enrichment-v1.mjs \
            scripts/check-briefing-fx-context.mjs \
            scripts/check-briefing-canonical-v16.mjs \
            scripts/check-visual-knowledge-timeline.mjs \
            scripts/check-visual-knowledge-state-government.mjs \
            scripts/check-visual-knowledge-editorial-layout-v2.mjs \
            scripts/check-legacy-wordpress-migration.mjs \
            scripts/check-public-search-cta.mjs \
            scripts/check-admin-product-briefing-workspace.mjs \
            scripts/check-admin-team-owner-v1.mjs \
            scripts/check-mobile-experience-package-a.mjs \
            scripts/check-mukalla-home-hero.mjs \
            scripts/check-sas-split-hero.mjs \
            scripts/check-sas-pill-nav-v1.mjs \
            scripts/check-sas-metallic-logo-v1.mjs \
            scripts/check-public-scroll-reveal-v1.mjs \
            scripts/check-home-briefing-cover-v3.mjs \
            scripts/check-home-briefing-rotating-copy-v1.mjs \
            scripts/check-home-insights-showcase-v1.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
